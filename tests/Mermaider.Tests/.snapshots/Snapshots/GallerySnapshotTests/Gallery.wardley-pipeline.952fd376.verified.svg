<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" style="--bg:#FFFFFF;--fg:#27272A;--line:#546072;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 12%, transparent)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 7%, transparent)); }
</style>

<g class="diagram-title">
  <rect x="48" y="19.5" width="9" height="9" rx="2" ry="2" fill="var(--accent, var(--fg))" />
  <text x="64" y="24" text-anchor="start" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)" dy="6.3">Data Platform</text>
</g>
<g class="wardley-axes">
  <line x1="48" y1="552" x2="852" y2="552" stroke="var(--_line)" stroke-width="1.25" />
  <line x1="48" y1="48" x2="48" y2="552" stroke="var(--_line)" stroke-width="1.25" />
  <text x="450" y="584" text-anchor="middle" font-size="var(--fs-xs)" font-weight="700" fill="var(--_text)" dy="4.2">Evolution</text>
  <g transform="translate(16 300) rotate(-90)"><text x="0" y="0" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" dy="4.2">Visibility</text></g>
</g>
<g class="wardley-stages">
  <text x="148.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Genesis</text>
  <line x1="249" y1="48" x2="249" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="349.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Custom Built</text>
  <line x1="450" y1="48" x2="450" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="550.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Product</text>
  <line x1="651" y1="48" x2="651" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="751.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Commodity</text>
</g>
<g class="subgraph wardley-pipeline" data-id="Storage">
  <rect x="274.2" y="313.2" width="432" height="24" rx="10" ry="10" fill="color-mix(in srgb, var(--_line) 6%, var(--bg))" stroke="color-mix(in srgb, var(--_line) 42%, var(--bg))" stroke-width="1.25" />
  <line class="wardley-pipeline-link" x1="289.2" y1="325.2" x2="530.4" y2="325.2" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="1.5 4.5" />
  <line class="wardley-pipeline-link" x1="530.4" y1="325.2" x2="691.2" y2="325.2" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="1.5 4.5" />
</g>
<g class="edge wardley-link" data-from="Analyst" data-to="Dashboards">
  <line x1="527.583" y1="78.498" x2="493.017" y2="143.502" stroke="var(--_line)" stroke-width="1.5" />
</g>
<g class="edge wardley-link" data-from="Dashboards" data-to="Storage_Warehouse">
  <line x1="491.533" y1="154.65" x2="529.067" y2="319.35" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#m1814eb8b-mk-arrow)" />
  <g transform="rotate(77.162 518.1 235.222)"><text x="518.1" y="235.22" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">queries</text></g>
</g>
<g class="edge wardley-link" data-from="Dashboards" data-to="Storage">
  <line x1="490.2" y1="154.8" x2="490.2" y2="304.812" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g transform="rotate(90 498.2 230.2)"><text x="498.2" y="230.2" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">reads</text></g>
</g>
<g class="node wardley-node" data-id="Analyst" data-kind="anchor">
  <text x="530.4" y="70.2" text-anchor="middle" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.9">Analyst</text>
</g>
<g class="node wardley-node" data-id="Dashboards" data-kind="component">
  <circle cx="490.2" cy="148.8" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="498.2" y="136.8" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Dashboards</text>
</g>
<g class="node wardley-node" data-id="Storage_File Store" data-kind="pipeline-component">
  <circle cx="289.2" cy="325.2" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="297.2" y="313.2" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">File Store</text>
</g>
<g class="node wardley-node" data-id="Storage_Warehouse" data-kind="pipeline-component">
  <circle cx="530.4" cy="325.2" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="538.4" y="313.2" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Warehouse</text>
</g>
<g class="node wardley-node" data-id="Storage_Lakehouse" data-kind="pipeline-component">
  <circle cx="691.2" cy="325.2" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="699.2" y="313.2" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Lakehouse</text>
</g>
<g class="node wardley-node" data-id="Storage" data-kind="component">
  <rect x="485.4" y="306.8" width="9.6" height="9.6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="498.2" y="299.6" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Storage</text>
</g>
<g class="wardley-annotations">
  <g class="wardley-annotation">
  <circle cx="450" cy="128.64" r="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" />
    <text x="450" y="128.64" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="var(--_text)" dy="4.2">1</text>
  </g>
  <g class="wardley-annotation">
  <circle cx="530.4" cy="370.56" r="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" />
    <text x="530.4" y="370.56" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="var(--_text)" dy="4.2">2</text>
  </g>
  <g class="wardley-annotations-box">
    <rect class="plot-panel" x="88.2" y="451.2" width="200" height="52" rx="12" ry="12" fill="var(--_group-fill)" stroke="none" stroke-width="1" />
    <text x="98.2" y="468.2" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" dy="4.2">1. Self-service reporting</text>
    <text x="98.2" y="486.2" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" dy="4.2">2. Consolidate storage</text>
  </g>
</g>
<defs>
  <marker id="m1814eb8b-mk-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="12" refX="10" refY="6" orient="auto">
    <polygon points="0,1.5 10,6 0,10.5" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" stroke-linejoin="miter" />
  </marker>
</defs>
</svg>
