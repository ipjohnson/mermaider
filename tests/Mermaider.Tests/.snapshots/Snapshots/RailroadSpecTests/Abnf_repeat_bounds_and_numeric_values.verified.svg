<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 431 326" width="431" height="326" style="--bg:#FFFFFF;--fg:#27272A;--line:#546072;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 12%, transparent)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 7%, transparent)); }
</style>

<g class="diagram-title">
  <rect x="20" y="25.5" width="9" height="9" rx="2" ry="2" fill="var(--accent, var(--fg))" />
  <text x="36" y="30" text-anchor="start" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)" dy="6.3">IPv4 Address</text>
</g>
<g class="railroad-rule" data-rule="address">
  <text x="20" y="76" text-anchor="start" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)" dy="4.9">address =</text>
  <path class="railroad-track" d="M 213.56 76 L 223.56 76 M 281.76 76 L 291.76 76 M 223.56 76 L 243.56 76 M 375.18 76 L 395.18 76 M 375.18 76 A 10 10 0 0 1 385.18 86 L 385.18 105.1 A 10 10 0 0 1 375.18 115.1 L 243.56 115.1 A 10 10 0 0 1 233.56 105.1 L 233.56 86 A 10 10 0 0 1 243.56 76 M 115.14 76 L 130.14 76 M 395.18 76 L 400.18 76" fill="none" stroke="var(--_line)" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="110.13999999999999" cy="76" r="5" fill="var(--accent, var(--fg))" />
  <circle cx="405.18" cy="76" r="5" fill="none" stroke="var(--accent, var(--fg))" stroke-width="2" />
<circle cx="405.18" cy="76" r="2" fill="var(--accent, var(--fg))" />
  <g class="node railroad-nonterminal" data-kind="nonterminal">
    <rect x="130.14" y="56.9" width="83.42" height="38.2" rx="8" ry="8" fill="url(#m1814eb8b-ng-p0)" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.25" />
    <text x="171.85" y="76" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="color-mix(in srgb, #64748b 44%, var(--fg))" dy="4.9">dec-octet</text>
  </g>
  <g class="node railroad-terminal" data-kind="terminal">
    <rect x="243.56" y="56.9" width="38.2" height="38.2" rx="19.1" ry="19.1" fill="url(#m1814eb8b-ng-p1)" stroke="color-mix(in srgb, #f28e2b 74%, var(--fg))" stroke-width="1.25" />
    <text x="262.66" y="76" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="color-mix(in srgb, #f28e2b 44%, var(--fg))" dy="4.9">.</text>
  </g>
  <g class="node railroad-nonterminal" data-kind="nonterminal">
    <rect x="291.76" y="56.9" width="83.42" height="38.2" rx="8" ry="8" fill="url(#m1814eb8b-ng-p0)" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.25" />
    <text x="333.47" y="76" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="color-mix(in srgb, #64748b 44%, var(--fg))" dy="4.9">dec-octet</text>
  </g>
  <text x="309.37" y="115.1" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">×3</text>
</g>
<g class="railroad-rule" data-rule="dec-octet">
  <text x="20" y="171.1" text-anchor="start" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)" dy="4.9">dec-octet =</text>
  <path class="railroad-track" d="M 134.34 171.1 L 154.34 171.1 M 213.4 171.1 L 233.4 171.1 M 213.4 171.1 A 10 10 0 0 1 223.4 181.1 L 223.4 200.2 A 10 10 0 0 1 213.4 210.2 L 154.34 210.2 A 10 10 0 0 1 144.34 200.2 L 144.34 181.1 A 10 10 0 0 1 154.34 171.1 M 119.34 171.1 L 134.34 171.1 M 233.4 171.1 L 238.4 171.1" fill="none" stroke="var(--_line)" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="114.34" cy="171.1" r="5" fill="var(--accent, var(--fg))" />
  <circle cx="243.4" cy="171.1" r="5" fill="none" stroke="var(--accent, var(--fg))" stroke-width="2" />
<circle cx="243.4" cy="171.1" r="2" fill="var(--accent, var(--fg))" />
  <g class="node railroad-nonterminal" data-kind="nonterminal">
    <rect x="154.34" y="152" width="59.06" height="38.2" rx="8" ry="8" fill="url(#m1814eb8b-ng-p0)" stroke="color-mix(in srgb, #64748b 74%, var(--fg))" stroke-width="1.25" />
    <text x="183.87" y="171.1" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="color-mix(in srgb, #64748b 44%, var(--fg))" dy="4.9">DIGIT</text>
  </g>
  <text x="183.87" y="210.2" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">×1–3</text>
</g>
<g class="railroad-rule" data-rule="DIGIT">
  <text x="20" y="266.2" text-anchor="start" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)" dy="4.9">DIGIT =</text>
  <path class="railroad-track" d="M 94.98 266.2 L 109.98 266.2 M 188.36 266.2 L 193.36 266.2" fill="none" stroke="var(--_line)" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="89.97999999999999" cy="266.2" r="5" fill="var(--accent, var(--fg))" />
  <circle cx="198.35999999999999" cy="266.2" r="5" fill="none" stroke="var(--accent, var(--fg))" stroke-width="2" />
<circle cx="198.35999999999999" cy="266.2" r="2" fill="var(--accent, var(--fg))" />
  <g class="node railroad-terminal" data-kind="terminal">
    <rect x="109.98" y="247.1" width="78.38" height="38.2" rx="19.1" ry="19.1" fill="url(#m1814eb8b-ng-p1)" stroke="color-mix(in srgb, #f28e2b 74%, var(--fg))" stroke-width="1.25" />
    <text x="149.17" y="266.2" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="color-mix(in srgb, #f28e2b 44%, var(--fg))" dy="4.9">%x30-39</text>
  </g>
</g>
<defs>
  <linearGradient id="m1814eb8b-ng-p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #64748b 15%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #64748b 7%, var(--bg))" /></linearGradient>
  <linearGradient id="m1814eb8b-ng-p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #f28e2b 15%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #f28e2b 7%, var(--bg))" /></linearGradient>
</defs>
</svg>
