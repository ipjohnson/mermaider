  <path d="M30,402 L30,390 Q30,380 40,380 L64.75999999999999,380 L64.75999999999999,402 Z" fill="color-mix(in srgb, #9c755f 22%, var(--bg))" stroke="color-mix(in srgb, #9c755f 42%, var(--bg))" stroke-width="1.25" />
  <text x="47.38" y="391" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="color-mix(in srgb, #9c755f 44%, var(--fg))" dy="4.2">alt</text>
  <text x="214" y="391" text-anchor="middle" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #9c755f 44%, var(--fg))" dy="4.9">Retry</text>
  <line x1="30" y1="508" x2="398" y2="508" stroke="color-mix(in srgb, #9c755f 42%, var(--bg))" stroke-width="1.25" stroke-dasharray="5 4" />
