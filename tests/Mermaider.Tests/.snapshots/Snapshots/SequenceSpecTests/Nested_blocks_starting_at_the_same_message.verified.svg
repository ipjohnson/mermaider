  <path d="M38,448 L38,436 Q38,426 48,426 L77.08,426 L77.08,448 Z" fill="color-mix(in srgb, #b07aa1 22%, var(--bg))" stroke="color-mix(in srgb, #b07aa1 42%, var(--bg))" stroke-width="1.25" />
