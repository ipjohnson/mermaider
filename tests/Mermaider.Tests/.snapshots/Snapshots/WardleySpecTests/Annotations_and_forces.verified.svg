<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" style="--bg:#FFFFFF;--fg:#27272A;--line:#546072;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 12%, transparent)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 7%, transparent)); }
</style>

<g class="diagram-title">
  <rect x="48" y="19.5" width="9" height="9" rx="2" ry="2" fill="var(--accent, var(--fg))" />
  <text x="64" y="24" text-anchor="start" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)" dy="6.3">Forces</text>
</g>
<g class="wardley-axes">
  <line x1="48" y1="552" x2="852" y2="552" stroke="var(--_line)" stroke-width="1.25" />
  <line x1="48" y1="48" x2="48" y2="552" stroke="var(--_line)" stroke-width="1.25" />
  <text x="450" y="584" text-anchor="middle" font-size="var(--fs-xs)" font-weight="700" fill="var(--_text)" dy="4.2">Evolution</text>
  <g transform="translate(16 300) rotate(-90)"><text x="0" y="0" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" dy="4.2">Visibility</text></g>
</g>
<g class="wardley-stages">
  <text x="148.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Genesis / Concept</text>
  <line x1="249" y1="48" x2="249" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="349.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Custom / Emerging</text>
  <line x1="450" y1="48" x2="450" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="550.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Product / Converging</text>
  <line x1="651" y1="48" x2="651" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="751.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Commodity / Accepted</text>
</g>
<g class="edge wardley-link" data-from="API" data-to="Cache">
  <line x1="605.264" y1="251.914" x2="495.736" y2="297.686" stroke="var(--_line)" stroke-width="1.5" />
</g>
<g class="edge wardley-link" data-from="Cache" data-to="Database">
  <line x1="484.664" y1="302.314" x2="375.136" y2="348.086" stroke="var(--_line)" stroke-width="1.5" />
</g>
<g class="node wardley-node" data-id="API" data-kind="component">
  <circle cx="610.8" cy="249.6" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="618.8" y="237.6" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">API</text>
</g>
<g class="node wardley-node" data-id="Cache" data-kind="component">
  <circle cx="490.2" cy="300" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="498.2" y="288" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Cache</text>
</g>
<g class="node wardley-node" data-id="Database" data-kind="component">
  <circle cx="369.6" cy="350.4" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="377.6" y="338.4" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Database</text>
</g>
<g class="wardley-annotations">
  <g class="wardley-annotation">
  <circle cx="570.6" cy="249.6" r="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" />
    <text x="570.6" y="249.6" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="var(--_text)" dy="4.2">1</text>
  </g>
  <g class="wardley-annotation">
  <circle cx="450" cy="300" r="10" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" />
    <text x="450" y="300" text-anchor="middle" font-size="var(--fs-xs)" font-weight="600" fill="var(--_text)" dy="4.2">2</text>
  </g>
  <g class="wardley-annotations-box">
    <rect class="plot-panel" x="88.2" y="73.2" width="171.2" height="52" rx="12" ry="12" fill="var(--_group-fill)" stroke="none" stroke-width="1" />
    <text x="98.2" y="90.2" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" dy="4.2">1. Critical component</text>
    <text x="98.2" y="108.2" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" dy="4.2">2. Performance layer</text>
  </g>
</g>
<g class="wardley-force" data-kind="accelerator">
  <path d="M249,259.8 L289,259.8 L289,251.8 L309,274.8 L289,297.8 L289,289.8 L249,289.8 Z" fill="color-mix(in srgb, #59a14f 26%, var(--bg))" stroke="color-mix(in srgb, #59a14f 42%, var(--bg))" stroke-width="1.25" stroke-linejoin="round" />
  <text x="279" y="300.8" text-anchor="middle" font-size="var(--fs-xs)" font-weight="700" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">AI Adoption</text>
</g>
<g class="wardley-force" data-kind="deaccelerator">
  <path d="M711,461.4 L671,461.4 L671,453.4 L651,476.4 L671,499.4 L671,491.4 L711,491.4 Z" fill="color-mix(in srgb, #edc948 26%, var(--bg))" stroke="color-mix(in srgb, #edc948 42%, var(--bg))" stroke-width="1.25" stroke-linejoin="round" />
  <text x="681" y="502.4" text-anchor="middle" font-size="var(--fs-xs)" font-weight="700" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Legacy Constraints</text>
</g>
</svg>
