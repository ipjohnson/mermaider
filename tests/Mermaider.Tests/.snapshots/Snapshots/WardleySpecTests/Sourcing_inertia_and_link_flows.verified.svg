<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" style="--bg:#FFFFFF;--fg:#27272A;--line:#546072;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 12%, transparent)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 7%, transparent)); }
</style>

<g class="diagram-title">
  <rect x="48" y="19.5" width="9" height="9" rx="2" ry="2" fill="var(--accent, var(--fg))" />
  <text x="64" y="24" text-anchor="start" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)" dy="6.3">Sourcing</text>
</g>
<g class="wardley-axes">
  <line x1="48" y1="552" x2="852" y2="552" stroke="var(--_line)" stroke-width="1.25" />
  <line x1="48" y1="48" x2="48" y2="552" stroke="var(--_line)" stroke-width="1.25" />
  <text x="450" y="584" text-anchor="middle" font-size="var(--fs-xs)" font-weight="700" fill="var(--_text)" dy="4.2">Evolution</text>
  <g transform="translate(16 300) rotate(-90)"><text x="0" y="0" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" dy="4.2">Visibility</text></g>
</g>
<g class="wardley-stages">
  <text x="148.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Genesis</text>
  <line x1="249" y1="48" x2="249" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="349.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Custom Built</text>
  <line x1="450" y1="48" x2="450" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="550.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Product</text>
  <line x1="651" y1="48" x2="651" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="751.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Commodity</text>
</g>
<g class="edge wardley-link" data-from="Customer" data-to="Custom App">
  <line x1="809.312" y1="154.26" x2="733.888" y2="319.74" stroke="var(--_line)" stroke-width="1.5" />
</g>
<g class="edge wardley-link" data-from="Custom App" data-to="Off-the-shelf Tool">
  <line x1="727.659" y1="320.509" x2="574.341" y2="128.291" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#m1814eb8b-mk-arrow)" />
</g>
<g class="edge wardley-link" data-from="Custom App" data-to="Managed Service">
  <line x1="725.527" y1="323.973" x2="375.473" y2="250.827" stroke="var(--_line)" stroke-width="1.5" marker-start="url(#m1814eb8b-mk-arrow-s)" marker-end="url(#m1814eb8b-mk-arrow)" />
</g>
<g class="edge wardley-link" data-from="Off-the-shelf Tool" data-to="Cloud Platform">
  <line x1="564.672" y1="122.671" x2="254.928" y2="74.129" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#m1814eb8b-mk-arrow)" />
  <g transform="rotate(8.907 408.561 106.304)"><text x="408.56" y="106.3" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">hosted on</text></g>
</g>
<g class="edge wardley-link" data-from="Managed Service" data-to="Cloud Platform">
  <line x1="366.214" y1="244.647" x2="252.386" y2="78.153" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="5 4" />
  <g transform="rotate(55.641 302.696 165.915)"><text x="302.7" y="165.92" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">runs on</text></g>
</g>
<g class="node wardley-node" data-id="Customer" data-kind="anchor">
  <text x="811.8" y="145.8" text-anchor="middle" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.9">Customer</text>
</g>
<g class="node wardley-node" data-id="Custom App" data-kind="component" data-sourcing="build">
  <circle cx="731.4" cy="325.2" r="12" fill="color-mix(in srgb, var(--_line) 6%, var(--bg))" stroke="var(--_text)" stroke-width="1" />
  <circle cx="731.4" cy="325.2" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="749.4" y="303.2" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Custom App</text>
</g>
<g class="node wardley-node" data-id="Off-the-shelf Tool" data-kind="component" data-sourcing="buy">
  <circle cx="570.6" cy="123.6" r="12" fill="color-mix(in srgb, var(--_line) 42%, var(--bg))" stroke="var(--_text)" stroke-width="1" />
  <circle cx="570.6" cy="123.6" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="588.6" y="101.6" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Off-the-shelf Tool</text>
</g>
<g class="node wardley-node" data-id="Managed Service" data-kind="component" data-sourcing="outsource">
  <circle cx="369.6" cy="249.6" r="12" fill="color-mix(in srgb, var(--_line) 74%, var(--fg))" stroke="var(--_text)" stroke-width="1" />
  <circle cx="369.6" cy="249.6" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <line class="wardley-inertia" x1="406.6" y1="243.6" x2="406.6" y2="255.6" stroke="var(--_text)" stroke-width="6" />
  <text x="387.6" y="227.6" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Managed Service</text>
</g>
<g class="node wardley-node" data-id="Cloud Platform" data-kind="component" data-sourcing="market">
  <circle cx="249" cy="73.2" r="12" fill="var(--bg)" stroke="var(--_text)" stroke-width="1" />
  <line x1="249" y1="66" x2="242.765" y2="76.8" stroke="var(--_text)" stroke-width="1" />
  <line x1="242.765" y1="76.8" x2="255.235" y2="76.8" stroke="var(--_text)" stroke-width="1" />
  <line x1="255.235" y1="76.8" x2="249" y2="66" stroke="var(--_text)" stroke-width="1" />
  <circle cx="249" cy="66" r="4.2" fill="var(--bg)" stroke="var(--_text)" stroke-width="2" />
  <circle cx="242.765" cy="76.8" r="4.2" fill="var(--bg)" stroke="var(--_text)" stroke-width="2" />
  <circle cx="255.235" cy="76.8" r="4.2" fill="var(--bg)" stroke="var(--_text)" stroke-width="2" />
  <text x="267" y="51.2" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Cloud Platform</text>
</g>
<defs>
  <marker id="m1814eb8b-mk-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="12" refX="10" refY="6" orient="auto">
    <polygon points="0,1.5 10,6 0,10.5" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" stroke-linejoin="miter" />
  </marker>
  <marker id="m1814eb8b-mk-arrow-s" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="12" refX="0" refY="6" orient="auto">
    <polygon points="10,1.5 0,6 10,10.5" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" stroke-linejoin="miter" />
  </marker>
</defs>
</svg>
