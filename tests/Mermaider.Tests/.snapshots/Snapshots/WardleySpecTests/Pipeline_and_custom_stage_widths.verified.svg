<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" style="--bg:#FFFFFF;--fg:#27272A;--line:#546072;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 12%, transparent)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 7%, transparent)); }
</style>

<g class="diagram-title">
  <rect x="48" y="19.5" width="9" height="9" rx="2" ry="2" fill="var(--accent, var(--fg))" />
  <text x="64" y="24" text-anchor="start" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)" dy="6.3">Storage</text>
</g>
<g class="wardley-axes">
  <line x1="48" y1="552" x2="852" y2="552" stroke="var(--_line)" stroke-width="1.25" />
  <line x1="48" y1="48" x2="48" y2="552" stroke="var(--_line)" stroke-width="1.25" />
  <text x="450" y="584" text-anchor="middle" font-size="var(--fs-xs)" font-weight="700" fill="var(--_text)" dy="4.2">Evolution</text>
  <g transform="translate(16 300) rotate(-90)"><text x="0" y="0" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" dy="4.2">Visibility</text></g>
</g>
<g class="wardley-stages">
  <text x="128.4" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Genesis</text>
  <line x1="208.8" y1="48" x2="208.8" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="289.2" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Custom</text>
  <line x1="369.6" y1="48" x2="369.6" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="510.3" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Product</text>
  <line x1="651" y1="48" x2="651" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="751.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Commodity</text>
</g>
<g class="subgraph wardley-pipeline" data-id="Database">
  <rect x="234" y="338.4" width="512.4" height="24" rx="10" ry="10" fill="color-mix(in srgb, var(--_line) 6%, var(--bg))" stroke="color-mix(in srgb, var(--_line) 42%, var(--bg))" stroke-width="1.25" />
  <line class="wardley-pipeline-link" x1="249" y1="350.4" x2="450" y2="350.4" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="1.5 4.5" />
  <line class="wardley-pipeline-link" x1="450" y1="350.4" x2="731.4" y2="350.4" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="1.5 4.5" />
</g>
<g class="edge wardley-link" data-from="App" data-to="Database">
  <line x1="607.56" y1="153.85" x2="493.865" y2="331.086" stroke="var(--_line)" stroke-width="1.5" />
</g>
<g class="edge wardley-link" data-from="App" data-to="Database_SQL DB">
  <line x1="607.059" y1="153.491" x2="453.741" y2="345.709" stroke="var(--_line)" stroke-width="1.5" />
</g>
<g class="node wardley-node" data-id="App" data-kind="component">
  <circle cx="610.8" cy="148.8" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="618.8" y="136.8" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">App</text>
</g>
<g class="node wardley-node" data-id="Database_File System" data-kind="pipeline-component">
  <circle cx="249" cy="350.4" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="257" y="338.4" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">File System</text>
</g>
<g class="node wardley-node" data-id="Database_SQL DB" data-kind="pipeline-component">
  <circle cx="450" cy="350.4" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="458" y="338.4" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">SQL DB</text>
</g>
<g class="node wardley-node" data-id="Database_Cloud DB" data-kind="pipeline-component">
  <circle cx="731.4" cy="350.4" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="711.4" y="366.4" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Cloud DB</text>
</g>
<g class="node wardley-node" data-id="Database" data-kind="component">
  <rect x="485.4" y="332" width="9.6" height="9.6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="498.2" y="324.8" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Database</text>
</g>
</svg>
