<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" style="--bg:#FFFFFF;--fg:#27272A;--line:#546072;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 12%, transparent)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--fg) 7%, transparent)); }
</style>

<g class="diagram-title">
  <rect x="48" y="19.5" width="9" height="9" rx="2" ry="2" fill="var(--accent, var(--fg))" />
  <text x="64" y="24" text-anchor="start" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)" dy="6.3">Software Platform Strategy</text>
</g>
<g class="wardley-axes">
  <line x1="48" y1="552" x2="852" y2="552" stroke="var(--_line)" stroke-width="1.25" />
  <line x1="48" y1="48" x2="48" y2="552" stroke="var(--_line)" stroke-width="1.25" />
  <text x="450" y="584" text-anchor="middle" font-size="var(--fs-xs)" font-weight="700" fill="var(--_text)" dy="4.2">Evolution</text>
  <g transform="translate(16 300) rotate(-90)"><text x="0" y="0" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" dy="4.2">Visibility</text></g>
</g>
<g class="wardley-stages">
  <text x="148.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Genesis</text>
  <line x1="249" y1="48" x2="249" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="349.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Custom</text>
  <line x1="450" y1="48" x2="450" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="550.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Product</text>
  <line x1="651" y1="48" x2="651" y2="552" stroke="var(--_line)" stroke-width="1" stroke-dasharray="5 4" />
  <text x="751.5" y="564" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text-sec)" dy="4.2">Commodity</text>
</g>
<g class="edge wardley-link" data-from="Customer" data-to="Mobile App">
  <line x1="621.393" y1="90.748" x2="495.687" y2="146.372" stroke="var(--_line)" stroke-width="1.5" />
</g>
<g class="edge wardley-link" data-from="Mobile App" data-to="API Gateway">
  <line x1="495.062" y1="152.316" x2="589.858" y2="220.884" stroke="var(--_line)" stroke-width="1.5" />
</g>
<g class="edge wardley-link" data-from="API Gateway" data-to="Auth Service">
  <line x1="599.684" y1="227.771" x2="686.236" y2="286.549" stroke="var(--_line)" stroke-width="1.5" />
</g>
<g class="edge wardley-link" data-from="API Gateway" data-to="Database">
  <line x1="589.762" y1="227.779" x2="414.758" y2="347.021" stroke="var(--_line)" stroke-width="1.5" />
</g>
<g class="edge wardley-link" data-from="Database" data-to="Compute">
  <line x1="415.557" y1="352.089" x2="781.923" y2="459.591" stroke="var(--_line)" stroke-width="1.5" />
</g>
<g class="wardley-trend" data-id="Database">
  <line x1="409.8" y1="350.4" x2="667.12" y2="350.4" stroke="var(--accent, var(--fg))" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#m1814eb8b-mk-arrow-a)" />
</g>
<g class="node wardley-node" data-id="Customer" data-kind="anchor">
  <text x="626.88" y="85.32" text-anchor="middle" font-size="var(--fs-s)" font-weight="700" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.9">Customer</text>
</g>
<g class="node wardley-node" data-id="Mobile App" data-kind="component" data-sourcing="build">
  <circle cx="490.2" cy="148.8" r="12" fill="color-mix(in srgb, var(--_line) 6%, var(--bg))" stroke="var(--_text)" stroke-width="1" />
  <circle cx="490.2" cy="148.8" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="508.2" y="126.8" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Mobile App</text>
</g>
<g class="node wardley-node" data-id="API Gateway" data-kind="component" data-sourcing="buy">
  <circle cx="594.72" cy="224.4" r="12" fill="color-mix(in srgb, var(--_line) 42%, var(--bg))" stroke="var(--_text)" stroke-width="1" />
  <circle cx="594.72" cy="224.4" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="612.72" y="202.4" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">API Gateway</text>
</g>
<g class="node wardley-node" data-id="Auth Service" data-kind="component" data-sourcing="outsource">
  <circle cx="691.2" cy="289.92" r="12" fill="color-mix(in srgb, var(--_line) 74%, var(--fg))" stroke="var(--_text)" stroke-width="1" />
  <circle cx="691.2" cy="289.92" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <text x="709.2" y="267.92" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Auth Service</text>
</g>
<g class="node wardley-node" data-id="Database" data-kind="component" data-sourcing="buy">
  <circle cx="409.8" cy="350.4" r="12" fill="color-mix(in srgb, var(--_line) 42%, var(--bg))" stroke="var(--_text)" stroke-width="1" />
  <circle cx="409.8" cy="350.4" r="6" fill="var(--bg)" stroke="var(--_text)" stroke-width="1.25" />
  <line class="wardley-inertia" x1="446.8" y1="344.4" x2="446.8" y2="356.4" stroke="var(--_text)" stroke-width="6" />
  <text x="427.8" y="328.4" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Database</text>
</g>
<g class="node wardley-node" data-id="Compute" data-kind="component" data-sourcing="market">
  <circle cx="787.68" cy="461.28" r="12" fill="var(--bg)" stroke="var(--_text)" stroke-width="1" />
  <line x1="787.68" y1="454.08" x2="781.445" y2="464.88" stroke="var(--_text)" stroke-width="1" />
  <line x1="781.445" y1="464.88" x2="793.915" y2="464.88" stroke="var(--_text)" stroke-width="1" />
  <line x1="793.915" y1="464.88" x2="787.68" y2="454.08" stroke="var(--_text)" stroke-width="1" />
  <circle cx="787.68" cy="454.08" r="4.2" fill="var(--bg)" stroke="var(--_text)" stroke-width="2" />
  <circle cx="781.445" cy="464.88" r="4.2" fill="var(--bg)" stroke="var(--_text)" stroke-width="2" />
  <circle cx="793.915" cy="464.88" r="4.2" fill="var(--bg)" stroke="var(--_text)" stroke-width="2" />
  <text x="805.68" y="439.28" text-anchor="start" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Compute</text>
</g>
<g class="wardley-note">
  <text x="289.2" y="396.8" text-anchor="start" font-size="var(--fs-xs)" font-weight="700" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Migrate to a managed database</text>
</g>
<g class="wardley-force" data-kind="accelerator">
  <path d="M490.2,411 L530.2,411 L530.2,403 L550.2,426 L530.2,449 L530.2,441 L490.2,441 Z" fill="color-mix(in srgb, #59a14f 26%, var(--bg))" stroke="color-mix(in srgb, #59a14f 42%, var(--bg))" stroke-width="1.25" stroke-linejoin="round" />
  <text x="520.2" y="452" text-anchor="middle" font-size="var(--fs-xs)" font-weight="700" fill="var(--_text)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke" dy="4.2">Cloud native</text>
</g>
<defs>
  <marker id="m1814eb8b-mk-arrow-a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="12" refX="10" refY="6" orient="auto">
    <polygon points="0,1.5 10,6 0,10.5" fill="var(--accent, var(--fg))" stroke="var(--accent, var(--fg))" stroke-width="1" stroke-linejoin="miter" />
  </marker>
</defs>
</svg>